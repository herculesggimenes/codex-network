name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n bin/codex-network install.sh scripts/sync-remotes.sh scripts/sync-rdes.sh
      - name: CLI help smoke
        run: bin/codex-network --help >/dev/null
